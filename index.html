<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Thuyết Trình Của Tôi</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Màu nền tối sang trọng */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #f8fafc;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .presentation-container {
            width: 90%;
            max-width: 960px;
            aspect-ratio: 16 / 9; /* Giữ tỷ lệ khung hình chuẩn 16:9 cho slide */
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        /* Ép iframe lấp đầy khung chứa */
        .presentation-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Bài Thuyết Trình PowerPoint</h1>

    <div class="presentation-container">
        <!-- Đoạn iframe OneDrive của bạn đã được tối ưu kích thước -->
        <iframe src="https://1drv.ms/p/c/748E3259E281AB95/IQTZeRnU-PqMT7FVm7Kv9l6GAdA-J21eEdd6l3_1ySbdagQ?em=2&amp;wdAr=1.7777777777777777" frameborder="0" scrolling="no"></iframe>
    </div>

</body>
</html>
